[project]
name = "appointment-agent"
version = "0.1.0"
description = "Autonomous appointment call agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3.1",
    "langchain-openai>=0.2.1",
    "langgraph>=0.2.28",
    "python-depends",
    "loguru>=0.7.2",
    "uvicorn>=0.31.0",
    "pydantic-settings>=2.5.2",
    "fastapi>=0.115.0",
    "websockets>=13.1",
    "langsmith>=0.1.129",
    "langchain-community>=0.3.1",
    "httpx>=0.27.2",
    "sounddevice>=0.5.1",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
]

[tool.uv.sources]
python-depends = { git = "ssh://git@github.com/Dimfred/depends" }
